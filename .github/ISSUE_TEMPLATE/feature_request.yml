name: Feature Request ✨

description: Suggest a new feature or improvement

title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Description
        Describe the feature you'd like to request.

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      placeholder: What problem does this solve? In what scenario would you use this?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      placeholder: How should it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any other approaches you've considered?
